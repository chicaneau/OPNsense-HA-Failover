{
  "interfaces": {
    "wan_key": "wan"    
  },
  "network": {
    "wan_mode": "dhcp",
    "wan_gateway_name": "WAN_DHCP",
    "standby_gateway_ip": "10.0.0.2"
    
  },
  "timeouts": {
    "master_transition_delay": 20,
    "event_cooldown_period": 600,
    "passive_enforcer_delay": 20,
    "route_settle_delay": 3,
    "lock_wait_timeout": 90,
    "health_check_retries": 3,
    "health_check_retry_delay": 5,
    "service_verify_timeout": 15
  },
  "health_check": {
    "local_target": "10.0.1.254",
    "target": [
      "1.1.1.1",
      "8.8.8.8"
    ],
    "target_v6": [
      "2001:4860:4860::8888",
      "2606:4700:4700::1111"
    ],
    "ping_timeout": 2,
    "require_external_connectivity": false
  },
  "failover_gateways": {
    "ipv4": "LAN_FAILOVER_GW",
    "ipv6": "LAN_FAILOVER_GW_V6"
  },
  "ha_core_services": [],
  "ha_controlled_services": [
    {
      "name": "kea-dhcp4",
    "pid_file": "/var/run/kea/kea-dhcp4.kea-dhcp4.pid"
    },
    {
      "name": "unbound",
      "pid_file": "/var/run/unbound.pid",
      "shutdown_timeout": 15
    },
    {
      "name": "adguardhome",
      "pid_file": "/var/run/adguardhome.pid"
    },
    {
      "name": "radvd",
      "pid_file": "/var/run/radvd.pid"
    }
  ]
}
